name: AiBox iOS
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Core regression tests
        run: swift test --parallel
      - name: Toolchain
        run: xcodebuild -version
      - name: Verify generated project is current
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- AiBox.xcodeproj
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/devices.json'))
          devices = [d for runtime, group in data['devices'].items() if 'iOS' in runtime for d in group if d['name'].startswith('iPhone') and d['isAvailable']]
          if not devices:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + devices[0]['udid'] + '\n')
          PY
      - name: Build for iPhone simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project AiBox.xcodeproj -scheme AiBox -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO | tee build-simulator.log
      - name: Build unsigned device archive
        run: |
          set -o pipefail
          xcodebuild archive -project AiBox.xcodeproj -scheme AiBox -configuration Release -destination 'generic/platform=iOS' -archivePath build/AiBox.xcarchive CODE_SIGNING_ALLOWED=NO | tee build-device.log
      - name: Run editor smoke test
        run: |
          set -o pipefail
          xcodebuild test-without-building -project AiBox.xcodeproj -scheme AiBox -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/DerivedData -resultBundlePath build/Simulator.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO | tee test-simulator.log
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/AiBox.xcarchive/Products/Applications/AiBox.app build/ipa/Payload/
          if codesign -dv build/ipa/Payload/AiBox.app 2>/dev/null; then
            echo 'Expected unsigned app'; exit 1
          fi
          cd build/ipa
          zip -qry "../AiBox-0.1.1-${{ github.run_number }}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AiBox-unsigned-ipa
          path: build/*-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AiBox-validation-${{ github.sha }}
          path: |
            build/*.xcresult
            build/*.xcarchive
            build-*.log
            test-*.log

  release:
    needs: ios
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AiBox-unsigned-ipa
          path: dist
      - name: Publish unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/RELEASE_NOTES.md release-notes.md
          cat >> release-notes.md <<EOFNOTES

          构建提交：${{ github.sha }}
          构建与验证：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          验证：核心测试、模拟器编辑测试与设备归档通过；未进行真机验证。
          签名类型：未签名，需自行签名后安装。
          EOFNOTES
          gh release create "v0.1.1-build.${{ github.run_number }}" dist/*.ipa --target "${{ github.sha }}" --title "AiBox 0.1.1 build ${{ github.run_number }}（未签名）" --notes-file release-notes.md --prerelease
