name: AiBox iOS
on:
  push:
    branches: ["feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Verify generated project is current
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- AiBox.xcodeproj
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/devices.json'))
          devices = [d for runtime, group in data['devices'].items() if 'iOS' in runtime for d in group if d['name'].startswith('iPhone') and d['isAvailable']]
          if not devices:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + devices[0]['udid'] + '\n')
          PY
      - name: Build and run editor smoke test
        run: |
          set -o pipefail
          xcodebuild test -project AiBox.xcodeproj -scheme AiBox -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/DerivedData -resultBundlePath build/Simulator.xcresult CODE_SIGNING_ALLOWED=NO | tee build-simulator.log
      - name: Build unsigned device archive
        run: |
          set -o pipefail
          xcodebuild archive -project AiBox.xcodeproj -scheme AiBox -configuration Release -destination 'generic/platform=iOS' -archivePath build/AiBox.xcarchive CODE_SIGNING_ALLOWED=NO | tee build-device.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AiBox-validation-${{ github.sha }}
          path: |
            build/*.xcresult
            build/*.xcarchive
            build-*.log
